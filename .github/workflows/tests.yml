# Corre los tests en cada push y pull request. No usa claves: los tests usan
# embeddings y LLM falsos, así que no gastan saldo de OpenAI.
name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      # "3.11" = la última 3.11 que GitHub tenga para su Ubuntu. No se usa
      # .python-version (3.11.9) porque GitHub no publica esa versión exacta
      # para Ubuntu 26.04; .python-version queda para Render y el equipo local.
      - name: Instalar Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Revisar sintaxis
        run: python -m compileall -q main.py src tests

      - name: Correr tests
        run: python -m pytest
